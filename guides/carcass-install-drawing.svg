<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Priyabadal Homes  carcass installation drawing</title>
  <desc id="desc">Exploded carcass assembly: sides, top, bottom, shelves, back, with BWP plywood, both-side 1mm laminate, 2mm edge banding.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d7e0da" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf8"/>
      <stop offset="100%" stop-color="#e4ebe6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f6a58"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#eef3f0"/>
  <rect x="24" y="24" width="912" height="592" rx="18" fill="#fff" stroke="#c5d2cb"/>
  <rect x="40" y="88" width="880" height="400" fill="url(#grid)"/>

  <text x="48" y="58" font-family="Georgia, serif" font-size="26" fill="#152019">Carcass install drawing</text>
  <text x="48" y="78" font-family="system-ui,sans-serif" font-size="13" fill="#5c6b62">Priyabadal Homes · BWP plywood · both-side 1mm laminate · 2mm edge banding</text>

  <!-- Left side -->
  <g transform="translate(90,140)">
    <rect x="0" y="0" width="36" height="280" rx="4" fill="url(#panel)" stroke="#4f6a58" stroke-width="2"/>
    <rect x="0" y="0" width="36" height="280" fill="none" stroke="#9a7340" stroke-width="3" opacity="0.55"/>
    <text x="18" y="300" text-anchor="middle" font-size="12" fill="#5c6b62">Left side</text>
  </g>

  <!-- Right side -->
  <g transform="translate(470,140)">
    <rect x="0" y="0" width="36" height="280" rx="4" fill="url(#panel)" stroke="#4f6a58" stroke-width="2"/>
    <rect x="0" y="0" width="36" height="280" fill="none" stroke="#9a7340" stroke-width="3" opacity="0.55"/>
    <text x="18" y="300" text-anchor="middle" font-size="12" fill="#5c6b62">Right side</text>
  </g>

  <!-- Top -->
  <g transform="translate(160,118)">
    <rect x="0" y="0" width="280" height="28" rx="4" fill="url(#panel)" stroke="#4f6a58" stroke-width="2"/>
    <text x="140" y="-8" text-anchor="middle" font-size="12" fill="#5c6b62">Top</text>
  </g>

  <!-- Bottom -->
  <g transform="translate(160,400)">
    <rect x="0" y="0" width="280" height="28" rx="4" fill="url(#panel)" stroke="#4f6a58" stroke-width="2"/>
    <text x="140" y="48" text-anchor="middle" font-size="12" fill="#5c6b62">Bottom / plinth</text>
  </g>

  <!-- Shelves -->
  <g transform="translate(170,220)">
    <rect x="0" y="0" width="260" height="16" rx="3" fill="#f0f4f1" stroke="#4f6a58"/>
    <rect x="0" y="70" width="260" height="16" rx="3" fill="#f0f4f1" stroke="#4f6a58"/>
    <text x="130" y="-10" text-anchor="middle" font-size="12" fill="#5c6b62">Adjustable shelves</text>
  </g>

  <!-- Back panel -->
  <g transform="translate(560,150)">
    <rect x="0" y="0" width="160" height="260" rx="6" fill="#f7faf8" stroke="#4f6a58" stroke-dasharray="6 4"/>
    <text x="80" y="140" text-anchor="middle" font-size="13" fill="#4f6a58">Back panel</text>
    <text x="80" y="160" text-anchor="middle" font-size="11" fill="#5c6b62">(squares the box)</text>
  </g>

  <!-- Assembly arrows -->
  <line x1="140" y1="280" x2="165" y2="280" stroke="#4f6a58" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="455" y1="280" x2="430" y2="280" stroke="#4f6a58" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="155" x2="300" y2="175" stroke="#4f6a58" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="395" x2="300" y2="375" stroke="#4f6a58" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="280" x2="555" y2="280" stroke="#4f6a58" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Spec callouts -->
  <g transform="translate(48,510)">
    <rect width="864" height="86" rx="12" fill="#f7faf8" stroke="#c5d2cb"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#152019">Construction standard</text>
    <text x="20" y="50" font-family="system-ui,sans-serif" font-size="13" fill="#5c6b62">1) BWP plywood core · 2) 1 mm laminate both sides · 3) 2 mm edge banding on exposed edges</text>
    <text x="20" y="72" font-family="system-ui,sans-serif" font-size="13" fill="#5c6b62">Scan the QR on the pack / website guide for step-by-step carcass assembly.</text>
  </g>

  <!-- Edge band detail bubble -->
  <g transform="translate(760,120)">
    <rect width="140" height="90" rx="10" fill="#fff9f0" stroke="#9a7340"/>
    <text x="12" y="24" font-size="12" font-weight="700" fill="#152019">Edge detail</text>
    <text x="12" y="44" font-size="11" fill="#5c6b62">2 mm banding</text>
    <text x="12" y="60" font-size="11" fill="#5c6b62">on exposed</text>
    <text x="12" y="76" font-size="11" fill="#5c6b62">carcass edges</text>
  </g>
</svg>
