<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" role="img" aria-label="Priyabadal Homes — Shutters, Doors, Wall Panels">
  <defs>
    <style>
      .wm {
        font-family: "Arial Black", Arial, Helvetica, sans-serif;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .tag {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Wordmark -->
  <text class="wm" x="360" y="58" text-anchor="middle" font-size="42">
    <tspan fill="#2f3133">PRIYABADAL</tspan>
    <tspan dx="14" fill="#8b5a3c">HOMES</tspan>
  </text>

  <!-- Accent rule under brand -->
  <line
    x1="118"
    y1="72"
    x2="602"
    y2="72"
    stroke="#8b5a3c"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Category line: Shutters-Doors-Wall panels -->
  <text
    class="tag"
    x="360"
    y="98"
    text-anchor="middle"
    fill="#3d2b6b"
    font-size="15"
  >SHUTTERS — DOORS — WALL PANELS</text>
</svg>
