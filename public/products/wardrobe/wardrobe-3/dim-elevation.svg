  <text x="44" y="98" font-family="system-ui,sans-serif" font-size="12" fill="#8a9690">SKU PBH-WR-03 · Front elevation · Open façade — carcass visible (see Drawing 2 for full internals)</text>
  <text x="44" y="116" font-family="system-ui,sans-serif" font-size="12" fill="#8a9690">Warm oak laminate · integrated LED · leather pulls</text>

