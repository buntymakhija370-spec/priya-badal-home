  <title>LED Oak Dressing Wardrobe — exterior elevation shop drawing</title>
  <rect width="980" height="1280" fill="#ffffff"/>
  <rect x="20" y="20" width="940" height="1240" rx="8" fill="none" stroke="#c5d2cb" stroke-width="2"/>

