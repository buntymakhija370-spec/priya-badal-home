  <rect x="40" y="1160" width="900" height="80" rx="8" fill="#f7faf8" stroke="#c5d2cb"/>
  <text x="56" y="1186" font-size="13" font-weight="700" fill="#152019">Notes</text>
  <text x="56" y="1206" font-size="12" fill="#5c6b62">Drawing 1 — façade / shutters · Drawing 2 — full carcass internals (shelves, rods, drawers, shoes, LED) from carcass photo</text>
